          <a class="hero__phone" href="tel:+995598309038">+995598309038</a>
          <a
            class="hero__whatsapp"
            href="https://wa.me/995598309038"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n-aria="aria.whatsapp"
            aria-label="Написать в WhatsApp"
          >

      </header>

      <section class="search-filters container" data-apartment-filters aria-label="Параметры поиска">
        <div class="search-filters__row search-filters__row--top">
          <label class="search-filters__city-wrap">
            <span class="visually-hidden">Город</span>
            <input class="search-filters__city" type="text" name="city" value="Батуми" autocomplete="address-level2" />
          </label>
          <div class="search-filters__types" role="group" aria-label="Тип объекта">
            <a href="/new-building.html" class="filter-type-btn filter-type-btn--link">Новостройки</a>
            <a href="/apartments.html" class="filter-type-btn filter-type-btn--link is-active" aria-current="page">Квартира</a>
            <button type="button" class="filter-type-btn">Дом</button>
          </div>
          <div class="search-filters__recent">
            <span class="search-filters__recent-label">Добавленные недавно</span>
            <button type="button" class="search-filters__recent-toggle" aria-label="Только недавно добавленные" aria-pressed="false"></button>
          </div>
        </div>

        <div class="search-filters__row search-filters__row--cards">
          <div class="filter-card">
            <div class="filter-card__head">
              <span class="filter-card__title">Ценовой диапазон</span>
              <button type="button" class="currency-toggle is-usd" aria-label="Валюта: доллар" aria-pressed="false">
                <span class="currency-toggle__inner">
                  <span class="currency-toggle__sign currency-toggle__sign--usd" aria-hidden="true">$</span>
                  <span class="currency-toggle__sign currency-toggle__sign--gel" aria-hidden="true">₾</span>
                  <span class="currency-toggle__knob" aria-hidden="true">$</span>
                </span>
              </button>
            </div>
            <div class="filter-card__fields filter-card__fields--2">
              <label class="filter-field">
                <span class="visually-hidden">От</span>
                <input type="text" class="filter-input filter-input--muted" data-filter-price="min" value="20 000" placeholder="от" inputmode="numeric" />
                <span class="filter-input__suffix" data-currency-suffix aria-hidden="true">$</span>
              </label>
              <label class="filter-field">
                <span class="visually-hidden">До</span>
                <input type="text" class="filter-input filter-input--muted" data-filter-price="max" placeholder="до" />
                <span class="filter-input__suffix" data-currency-suffix aria-hidden="true">$</span>
              </label>
            </div>
          </div>

          <div class="filter-card">
            <div class="filter-card__head filter-card__head--simple">
              <span class="filter-card__title">Количество комнат</span>
            </div>
            <div class="filter-chips" role="group" aria-label="Комнаты">
              <button type="button" class="filter-chip is-active" data-filter-room="studio">Студия</button>
              <button type="button" class="filter-chip is-active" data-filter-room="1+1">1+1</button>
              <button type="button" class="filter-chip is-active" data-filter-room="2+1">2+1</button>
              <button type="button" class="filter-chip" data-filter-room="other">Другое</button>
            </div>
          </div>

          <div class="filter-card">
            <div class="filter-card__head filter-card__head--simple">
              <span class="filter-card__title">Общая площадь</span>
            </div>
            <div class="filter-card__fields filter-card__fields--2">
              <label class="filter-field">
                <span class="visually-hidden">От</span>
                <input type="text" class="filter-input filter-input--muted" data-filter-area="min" placeholder="от" />
                <span class="filter-input__suffix filter-input__suffix--m2" aria-hidden="true">м<sup>2</sup></span>
              </label>
              <label class="filter-field">
                <span class="visually-hidden">До</span>
                <input type="text" class="filter-input filter-input--muted" data-filter-area="max" placeholder="до" inputmode="numeric" />
                <span class="filter-input__suffix filter-input__suffix--m2" aria-hidden="true">м<sup>2</sup></span>
              </label>
            </div>
          </div>
        </div>

        <div class="search-filters__row search-filters__row--actions">
          <form class="search-filters__actions" data-apartment-search-form action="/apartments.html" method="get">
            <button class="btn-search" type="submit">
              <img src="/images/icon-search.svg" alt="" width="24" height="24" />
              <span data-i18n="btn.search">Поиск</span>
            </button>
            <a class="btn-map" href="/map.html">
              <img src="/images/icon-map.svg" alt="" width="20" height="20" />
              <span data-i18n="btn.map">Смотреть на карте</span>
            </a>
          </form>
        </div>
      </section>

      <section class="search-toolbar container" aria-label="Сортировка и счётчик">
        <button type="button" class="search-sort">
          <img class="search-sort__icon" src="/images/icon-sort-arrows.svg" alt="" width="20" height="24" />
          <span class="search-sort__text">Рекомендуемые</span>
        </button>
        <p class="search-toolbar__count">2000 квартир</p>
      </section>

      <section
        class="search-results container"
        aria-label="Квартиры: результаты"
        data-property-card-group="apartments"
        data-property-card-lead="apt-orbi-beach-tower-2912"
      >
        <div class="search-results__grid"></div>
      </section>

      <nav class="pagination container" aria-label="Страницы результатов" data-apartment-pagination hidden>
        <a class="pagination__btn is-active" href="/apartments.html" aria-current="page">1</a>
        <a class="pagination__btn" href="#">2</a>
        <a class="pagination__btn" href="#">3</a>
        <a class="pagination__btn" href="#">4</a>
        <span class="pagination__ellipsis" aria-hidden="true">…</span>
        <a class="pagination__btn" href="#">123</a>
        <a class="pagination__btn pagination__btn--next" href="#" aria-label="Следующая страница">›</a>
      </nav>

      <footer class="footer footer--search">
        <div class="container footer__inner">
          <div class="footer__logo">
            <img src="/images/logo-footer.svg" alt="REALTOR GEORGIA" width="153" height="47" loading="lazy" />
          </div>
        </div>
      </footer>
